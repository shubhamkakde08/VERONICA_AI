<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VERONICA AI Project Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: Jira-style project hub — fixed left nav of SDLC phases, one working view on the right. Steel-blue engineering palette. */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --side:#e9edf3; --ink:#152235; --mut:#5b6a80; --line:#d6dde7;
  --acc:#1f6fb2; --acc-soft:#e3eefa; --good:#178a55; --warn:#b26b00; --bad:#c23347; --info:#5b4bc4;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c121b; --panel:#121b27; --side:#0f1722; --ink:#e3eaf3; --mut:#93a1b5; --line:#24324a;
  --acc:#5aa9ec; --acc-soft:#16304a; --good:#3fc985; --warn:#e9a53b; --bad:#f06b80; --info:#a596ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c121b; --panel:#121b27; --side:#0f1722; --ink:#e3eaf3; --mut:#93a1b5; --line:#24324a;
  --acc:#5aa9ec; --acc-soft:#16304a; --good:#3fc985; --warn:#e9a53b; --bad:#f06b80; --info:#a596ff; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--acc)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;height:100%}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
.proj{display:flex;gap:10px;align-items:center;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.proj .logo{width:34px;height:34px;border-radius:8px;background:var(--acc);color:#fff;display:grid;place-items:center;font:700 15px var(--display)}
.proj b{display:block;font:700 15px var(--display);letter-spacing:.02em}
.proj small{color:var(--mut);font-size:11.5px}
.nav{padding:8px;display:flex;flex-direction:column;gap:1px}
.nav .grp{font:600 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:12px 10px 4px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:7px 10px;border-radius:6px;color:var(--ink)}
.nav button:hover{background:var(--acc-soft)}
.nav button.on{background:var(--acc-soft);color:var(--acc);font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
.nav .n{margin-left:auto;font:500 11px var(--mono);color:var(--mut)}
.sidefoot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;font-size:12px}
main{overflow:auto;padding:22px 28px 60px}
.crumb{font-size:12px;color:var(--mut)}
h1{font:700 26px/1.2 var(--display);margin:2px 0 4px;text-wrap:balance}
.lead{color:var(--mut);max-width:72ch;margin:0 0 18px}
h2{font:700 17px var(--display);margin:24px 0 10px;letter-spacing:.01em}
h3{font:600 14px var(--body);margin:14px 0 6px}
p{max-width:78ch}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.stat b{display:block;font:700 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{color:var(--mut);font-size:12.5px}
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--acc-soft)}
.key{font:500 12px var(--mono);color:var(--acc);white-space:nowrap}
.mono{font-family:var(--mono);font-size:12.5px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.s-done{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.s-prog{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.s-todo{background:color-mix(in srgb,var(--mut) 16%,transparent);color:var(--mut)}
.s-open{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.s-review{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.s-wont{background:transparent;color:var(--mut);border-color:var(--line)}
.sev{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.sev i{width:9px;height:9px;border-radius:2px;display:inline-block}
.sev.Critical i{background:var(--bad)}.sev.Major i{background:var(--warn)}.sev.Minor i{background:var(--acc)}.sev.Trivial i{background:var(--mut)}
.epic{font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--acc-soft);color:var(--acc);white-space:nowrap}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.bar input,.bar select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px}
.bar input{width:240px}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto}
.col{background:var(--side);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:200px}
.col h4{margin:0 0 8px;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between}
.ticket{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
.ticket:hover{border-color:var(--acc)}
.ticket .t{font-size:13px;margin:4px 0 6px}
.ticket .m{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--mut)}
.pts{font:500 11px var(--mono);background:var(--side);border-radius:999px;padding:0 7px}
.timeline{display:grid;gap:10px}
.sprint{display:grid;grid-template-columns:150px 1fr;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.sprint .when{font:600 12px var(--mono);color:var(--mut)}
.sprint .nm{font:700 16px var(--display)}
.sprint ul{margin:6px 0 0;padding-left:18px}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--good)}
.doc h2{border-bottom:1px solid var(--line);padding-bottom:6px}
.doc ul,.doc ol{max-width:78ch;padding-left:20px}
.doc li{margin:3px 0}
.req{display:grid;grid-template-columns:78px 1fr 92px;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:0}
.req .p{font-size:11.5px;color:var(--mut);text-align:right}
.note{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent);padding:8px 12px;border-radius:0 6px 6px 0;font-size:13px;max-width:80ch}
svg text{fill:var(--ink);font-family:var(--body)}
.arch rect{fill:var(--panel);stroke:var(--line)}
.arch .hl{stroke:var(--acc);stroke-width:1.5}
.arch line,.arch path{stroke:var(--mut);stroke-width:1.4;fill:none}
.arch .lbl{font-size:10.5px;fill:var(--mut)}
.drawer{position:fixed;inset:0;background:rgba(10,16,26,.45);display:flex;justify-content:flex-end;z-index:20}
.drawer[hidden]{display:none}
.drawer .pane{width:min(560px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);padding:20px 22px;overflow:auto}
.drawer dl{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px;margin:12px 0}
.drawer dt{color:var(--mut)}
.drawer dd{margin:0}
.hist{border-left:2px solid var(--line);margin:8px 0 0 4px;padding-left:12px;font-size:12.5px}
.hist div{margin-bottom:6px}
.hist b{font-family:var(--mono);font-weight:500;color:var(--mut);margin-right:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.chk{color:var(--good);font-weight:700}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .proj,.sidefoot,.nav .grp{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap}
  main{padding:16px}
  .sprint{grid-template-columns:1fr}
  .req{grid-template-columns:64px 1fr}
  .req .p{display:none}
  .bar input{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="proj"><div class="logo">V</div><div><b>VERONICA AI</b><small>Project VRN · Venus Pipes IT</small></div></div>
    <nav class="nav" id="nav" aria-label="Project sections">
      <div class="grp">Plan</div>
      <button data-v="overview">Overview</button>
      <button data-v="prd">PRD</button>
      <button data-v="srs">SRS</button>
      <div class="grp">Build</div>
      <button data-v="backlog">Backlog &amp; epics<span class="n" id="nStories"></span></button>
      <button data-v="sprints">Sprints</button>
      <button data-v="board">Sprint board</button>
      <div class="grp">Test</div>
      <button data-v="tests">Test cases<span class="n" id="nTests"></span></button>
      <button data-v="bugs">Bugs<span class="n" id="nBugs"></span></button>
      <button data-v="rtm">Traceability</button>
      <div class="grp">Ship</div>
      <button data-v="releases">Releases</button>
      <button data-v="retro">Retrospective</button>
    </nav>
    <div class="sidefoot"><span>Updated 31-Oct-2026</span><button class="tbtn" id="theme" type="button">Dark</button></div>
  </aside>
  <main id="main"></main>
</div>
<div class="drawer" id="drawer" hidden><div class="pane" id="pane" role="dialog" aria-modal="true"></div></div>

<script>
/* ---------------- project data (from the real build of VERONICA, Oct 2026) ---------------- */
const EPICS = {
  E1:"Conversational reporting", E2:"Live dashboards", E3:"Access control & security",
  E4:"Voice & experience", E5:"Operations & deployment", E6:"Director security hardening"
};
const SPRINTS = [
  {id:"S0",name:"Sprint 0 · Discovery",when:"22–24 Oct",goal:"Agree what to build and how it connects to the ERP.",
   items:["Problem: HODs wait for IT to export Excel and build reports by hand","Decided: Python FastAPI + Claude agent on a read-only MySQL copy of Oracle ERP","Channel: secure web app; teachable /report skills; multilingual (EN/HI/GU/MR)"]},
  {id:"S1",name:"Sprint 1 · Core assistant",when:"24–26 Oct",goal:"Ask in plain language, get a correct report back."},
  {id:"S2",name:"Sprint 2 · Live dashboards",when:"26–28 Oct",goal:"Put the HTML MIS dashboards on live ERP data, with division locks."},
  {id:"S3",name:"Sprint 3 · Speed & trust",when:"28–29 Oct",goal:"Fast Sales Order dashboard, data proof, Issue dashboard, reliable sync."},
  {id:"S4",name:"Sprint 4 · Security & RBAC",when:"29–30 Oct",goal:"Close the open-link gap, audit every denial, let admins manage rights."},
  {id:"S5",name:"Sprint 5 · Admin console & stability",when:"30–31 Oct",goal:"One clean admin console; fix restart and slow-voice problems."},
  {id:"S6",name:"Sprint 6 · Director hardening",when:"Next",goal:"Dedicated LAN server, VPN, Google Authenticator 2FA, nothing stored outside."}

// [key, epic, title, points, sprint, status, acceptance]
const STORIES = [
 ["VRN-1","E1","As an HOD, I ask a question in plain language and get the answer from ERP data",8,"S1","Done","Read-only SQL only; DELETE/UPDATE/INTO OUTFILE refused; totals match a direct SQL"],
 ["VRN-2","E1","As an admin, I teach a report once and anyone allowed can run it as /reportname",5,"S1","Done","Skill saved with SQL + rules; runs with new dates"],
 ["VRN-3","E1","As a user, I get the report as Excel, HTML and PDF",5,"S1","Done","Indian number format; PDF skipped gracefully if GTK missing"],
 ["VRN-4","E4","As a user, I sign in to a web assistant branded VERONICA",8,"S1","Done","Password login, lockout after repeated failures, sessions"],

 ["VRN-8","E2","As production management, I see the Scrap MIS dashboard live",8,"S2","Done","Welded + Seamless views; matches the HTML generator's rules"],

 ["VRN-10","E2","As production, I see Jobcard-wise Scrap live",5,"S2","Done","Engine rules equal the dashboard rules"],
 ["VRN-11","E2","As sales management, I see the Sales Order MIS live (mark5)",8,"S2","Done","Column aliases for the ERP view; KG figures match V6 file"],
 ["VRN-12","E3","As an admin, I give each department a role and lock U2 users to Seamless data",5,"S2","Done","Division lock applies to answers, reports and dashboards"],
 ["VRN-13","E2","As a user, dashboards open without waiting for the AI",3,"S2","Done","Fast path routes period words straight to the engine"],
 ["VRN-14","E4","As a user, I still hear a voice when Gemini's daily limit is used up",3,"S2","Done","Offline Kokoro voice as backup"],
 ["VRN-15","E4","As an admin, I choose which screen themes each person may use",3,"S2","Done","Aurora, Arc, Holo, Nova, Forge, Titan, Atlas"],
 ["VRN-16","E1","As a user, I can ask on WhatsApp",3,"S2","Done","Signed webhook; callback URL must follow the tunnel"],
 ["VRN-17","E2","As sales management, the Sales Order dashboard opens in seconds",5,"S3","Done","Order-book cache 15 min, stale-while-revalidate 2 h, 240 s query limit"],

 ["VRN-21","E5","As IT, the Oracle → MySQL sync retries and a missing view shows a calm notice",3,"S3","Done","4 retries × 60 s; card hidden from non-admins until synced"],
 ["VRN-22","E1","VERONICA knows who the company people are",1,"S3","Done","knowledge/people.md"],
 ["VRN-23","E2","As admin / manager, I see Monthwise Sales Dispatch",5,"S4","Done","VIEW_SALE_INVOICE_PBI; FY to date by default"],

 ["VRN-25","E3","As IT, report files can't be opened by anyone who just has the link",3,"S4","Done","HMAC-signed links, expire after 7 days"],
 ["VRN-26","E3","As an admin, every refused request is logged and I'm alerted",5,"S4","Done","rb_security_events + logs/security.log; throttled e-mail alert"],
 ["VRN-27","E3","As an admin, I manage users, roles, views and report access from the screen",8,"S4","Done","Last-admin and self protections; every change audited"],

// [key, title, severity, status, sprint, found where, root cause, fix, history]
const BUGS = [

// test catalogue — automated suite tests/test_flow.py (all pass, last run 31-Oct-2026) + manual UAT
const TESTS = [

 ["TC-02","test_indian_numbers","Numbers formatted in lakhs / crores","FR-03","Unit"],

 ["TC-12","test_voice_web_endpoints_and_cache","Voice endpoint and cache","FR-09","Integration"],

    <line x1="40" y1="170" x2="${W-5}" y2="170" stroke="var(--line)"/>${bars}</svg>
  <div class="legend"><span><i style="display:inline-block;width:10px;height:10px;background:var(--acc);border-radius:2px"></i> done</span><span><i style="display:inline-block;width:10px;height:10px;background:var(--line);border-radius:2px"></i> planned</span></div></div>
  <h2>Sprint history</h2><div class="timeline">${SPRINTS.map(s => { const st = STORIES.filter(x => x[4]===s.id), t = ptsOf(s.id), d = donePts(s.id);
    return `<div class="sprint"><div><div class="when">${s.when}</div><div class="nm">${s.name.split("·")[1]||s.name}</div><div class="crumb">${s.id}${t?` · ${d}/${t} pts`:""}</div>${t?`<div class="prog"><i style="width:${Math.round(d/t*100)}%"></i></div>`:""}</div>
    <div><b>Goal:</b> ${esc(s.goal)}<ul>${(s.items||st.map(x => `<span class="key">${x[0]}</span> ${esc(x[2])} ${x[5]!=="Done"?pill(x[5]):""}`)).map(i => `<li>${i}</li>`).join("")}</ul></div></div>`; }).join("")}</div>`;
};
V.board = () => {
  const cols = ["To Do","In Progress","In Review","Done"], items = STORIES.filter(s => s[4]==="S6" || s[4]==="S5");
  return `<div class="crumb">VRN / Build / Board</div><h1>Sprint board · S5 + S6</h1>
  <p class="lead">Sprint 5 closed on 31-Oct. Sprint 6 carries the director's security work. Click a card for details.</p>
  <div class="board">${cols.map(c => { const it = items.filter(s => s[5]===c);
    return `<div class="col"><h4>${c}<span>${it.length}</span></h4>${it.map(s => `<div class="ticket" data-story="${s[0]}" tabindex="0"><span class="epic">${s[1]}</span><div class="t">${esc(s[2])}</div><div class="m"><span class="key">${s[0]}</span><span class="pts">${s[3]} pts</span></div></div>`).join("") || `<div class="crumb">Nothing here</div>`}</div>`; }).join("")}</div>`;
};
V.tests = () => {
  const area = [...new Set(TESTS.map(t => t[4]))];
  return `<div class="crumb">VRN / Test / Test cases</div><h1>Test cases</h1>
  <p class="lead">Automated suite <span class="mono">tests/test_flow.py</span>: ${TESTS.length} tests, all passing on the last run (31-Oct-2026). Manual UAT below.</p>
  <div class="grid g4" style="margin-bottom:14px">${area.map(a => `<div class="card stat"><b>${TESTS.filter(t=>t[4]===a).length}</b><span>${a}</span></div>`).join("")}</div>
  <div class="bar"><input id="tq" type="search" placeholder="Search tests" aria-label="Search tests"><select id="ta" aria-label="Type"><option value="">All types</option>${area.map(a=>`<option>${a}</option>`).join("")}</select></div>
  <div class="tbl"><table><thead><tr><th>ID</th><th>Test case</th><th>Function</th><th>Req</th><th>Type</th><th>Result</th></tr></thead><tbody id="ttb"></tbody></table></div>
  <h2>User acceptance tests</h2>
  <div class="tbl"><table><thead><tr><th>ID</th><th>Scenario</th><th>Req</th><th>Result</th><th>Evidence</th></tr></thead><tbody>
  ${UAT.map(u => `<tr><td class="key">${u[0]}</td><td>${esc(u[1])}</td><td class="mono">${u[2]}</td><td>${pill(u[3])}</td><td class="crumb">${esc(u[4])}</td></tr>`).join("")}</tbody></table></div>`;
};
function fillTests(){
  const q = ($("#tq").value||"").toLowerCase(), a = $("#ta").value;
  $("#ttb").innerHTML = TESTS.filter(t => (!q || (t.join(" ")).toLowerCase().includes(q)) && (!a || t[4]===a))
    .map(t => `<tr><td class="key">${t[0]}</td><td>${esc(t[2])}</td><td class="mono">${t[1]}</td><td class="mono">${t[3]}</td><td>${t[4]}</td><td>${pill("Pass")}</td></tr>`).join("");
}
V.bugs = () => {
  const c = s => BUGS.filter(b => b[2]===s).length;
  return `<div class="crumb">VRN / Test / Bugs</div><h1>Bugs</h1>
  <p class="lead">Every defect found from first build to today, with its root cause and fix. Click a row for the full ticket.</p>
  <div class="grid g4" style="margin-bottom:14px">
    <div class="card stat"><b>${BUGS.filter(b=>b[3]==="Open").length}</b><span>open</span></div>
    <div class="card stat"><b>${BUGS.filter(b=>b[3]==="Done").length}</b><span>fixed</span></div>
    <div class="card stat"><b>${c("Critical")}</b><span>critical (all fixed)</span></div>
    <div class="card stat"><b>${c("Major")}</b><span>major</span></div></div>
  <div class="bar"><input id="gq" type="search" placeholder="Search bugs" aria-label="Search bugs">
   <select id="gs" aria-label="Severity"><option value="">All severities</option><option>Critical</option><option>Major</option><option>Minor</option><option>Trivial</option></select>
   <select id="gt" aria-label="Status"><option value="">All statuses</option><option>Open</option><option>Done</option><option>Won't fix</option></select></div>
  <div class="tbl"><table><thead><tr><th>Key</th><th>Summary</th><th>Severity</th><th>Status</th><th>Sprint</th><th>Found by</th></tr></thead><tbody id="gtb"></tbody></table></div>`;
};
function fillBugs(){
  const q = ($("#gq").value||"").toLowerCase(), s = $("#gs").value, t = $("#gt").value;
  $("#gtb").innerHTML = BUGS.filter(b => (!q || b.join(" ").toLowerCase().includes(q)) && (!s || b[2]===s) && (!t || b[3]===t))
    .map(b => `<tr class="click" data-bug="${b[0]}"><td class="key">${b[0]}</td><td>${esc(b[1])}</td><td>${sev(b[2])}</td><td>${pill(b[3])}</td><td class="mono">${b[4]}</td><td class="crumb">${esc(b[5])}</td></tr>`).join("")
    || `<tr><td colspan="6" class="crumb">No bug matches.</td></tr>`;
}
V.rtm = () => `<div class="crumb">VRN / Test / Traceability</div><h1>Requirements traceability matrix</h1>
  <p class="lead">Each requirement mapped to the test cases that prove it. A requirement with no test is a gap.</p>
  <div class="tbl"><table><thead><tr><th>Req</th><th>Requirement</th><th>Tests</th><th>Coverage</th></tr></thead><tbody>
  ${FR.concat(NFR.map(n => [n[0], n[1]+": "+n[2], ""])).map(r => { const t = testsFor(r[0]).map(x=>x[0]).concat(UAT.filter(u=>u[2]===r[0]).map(u=>u[0]));
    return `<tr><td class="key">${r[0]}</td><td>${esc(r[1])}</td><td class="mono" style="max-width:340px">${t.join(", ")||"–"}</td><td>${t.length?pill("Done").replace("Done","Covered"):pill("Open").replace("Open","Gap")}</td></tr>`; }).join("")}</tbody></table></div>`;
V.releases = () => `<div class="crumb">VRN / Ship / Releases</div><h1>Releases</h1>
  <p class="lead">Deploy procedure for every release: test locally (pytest) → copy to staging → back up the PC's files into logs/backup_* → copy → md5 check every file → restart with RESTART_VERONICA.bat → health check.</p>
  <div class="tbl"><table><thead><tr><th>Version</th><th>Date</th><th>Name</th><th>What shipped</th></tr></thead><tbody>
  ${RELEASES.slice().reverse().map(r => `<tr><td class="key">${r[0]}</td><td class="mono">${r[1]}</td><td style="font-weight:600">${r[2]}</td><td>${esc(r[3])}</td></tr>`).join("")}</tbody></table></div>
  <h2>Definition of Done</h2>
  <ul><li>Acceptance criteria met and shown to the product owner</li><li>Automated tests added and the full suite green</li><li>No secret in code, logs or chat</li><li>Deployed with a backup and md5 check</li><li>Works in light and dark, on laptop and phone</li></ul>`;
V.retro = () => `<div class="crumb">VRN / Ship / Retrospective</div><h1>Retrospective</h1>
  <p class="lead">Looking back over sprints 1–5.</p>
  <div class="grid g2">
   <div class="card"><h3 style="margin-top:0;color:var(--good)">What went well</h3><ul style="margin:0;padding-left:18px">
    <li>Director impressed at the demo</li><li>Dashboards reuse the existing HTML templates, so numbers match what management knows</li><li>Test suite grew past 50 and caught real bugs before release (BUG-13)</li><li>Every deploy backed up and verified</li></ul></div>
   <div class="card"><h3 style="margin-top:0;color:var(--bad)">What hurt</h3><ul style="margin:0;padding-left:18px">
    <li>An unsynced view caused an error in front of management (BUG-8)</li><li>Free quick tunnel changed URL on every restart, breaking WhatsApp</li><li>Restarts need an admin click, which slowed every release</li><li>Report files were reachable without login until v1.3</li></ul></div>
   <div class="card"><h3 style="margin-top:0;color:var(--acc)">Actions</h3><ul style="margin:0;padding-left:18px">
    <li>Check data readiness before showing a dashboard (done)</li><li>Move to a fixed LAN address + VPN (S6)</li><li>Add 2-factor sign-in (S6)</li><li>Rotate exposed tokens; keep secrets only in .env (S6)</li></ul></div>
   <div class="card"><h3 style="margin-top:0">Lessons</h3><ul style="margin:0;padding-left:18px">
    <li>Security is a feature: plan it in Sprint 1 next time</li><li>Load data before the demo, not during it</li><li>Measure speed in the log: it found the voice problem in minutes</li></ul></div>
  </div>`;

/* ---------------- drawer ---------------- */
function openStory(k){
  const s = STORIES.find(x => x[0]===k);
  $("#pane").innerHTML = `<div class="crumb">${EPICS[s[1]]} / ${s[0]}</div><h1 style="font-size:21px">${esc(s[2])}</h1>${pill(s[5])}
  <dl><dt>Epic</dt><dd><span class="epic">${s[1]}</span> ${EPICS[s[1]]}</dd><dt>Story points</dt><dd>${s[3]}</dd><dt>Sprint</dt><dd>${sprintName(s[4])}</dd><dt>Assignee</dt><dd>Shubham Kakde (with Claude)</dd><dt>Acceptance</dt><dd>${esc(s[6])}</dd></dl>
  <button class="tbtn" type="button" data-close>Close</button>`;
  $("#drawer").hidden = false; $("#pane").querySelector("[data-close]").focus();
}
function openBug(k){
  const b = BUGS.find(x => x[0]===k);
  $("#pane").innerHTML = `<div class="crumb">Bug / ${b[0]}</div><h1 style="font-size:21px">${esc(b[1])}</h1><div style="display:flex;gap:10px;align-items:center">${sev(b[2])}${pill(b[3])}</div>
  <dl><dt>Sprint</dt><dd>${sprintName(b[4])}</dd><dt>Found by</dt><dd>${esc(b[5])}</dd><dt>Root cause</dt><dd>${esc(b[6])}</dd><dt>Fix</dt><dd>${esc(b[7])}</dd></dl>
  <h3>Workflow</h3><div class="hist"><div><b>Open</b>Reported (${esc(b[5])})</div><div><b>Analysis</b>${esc(b[6])}</div>${b[3]!=="Open"?`<div><b>${b[3]==="Done"?"Fixed":"Closed"}</b>${esc(b[7])}</div>`:`<div><b>Next</b>${esc(b[7])}</div>`}</div>
  <p><button class="tbtn" type="button" data-close>Close</button></p>`;
  $("#drawer").hidden = false; $("#pane").querySelector("[data-close]").focus();
}
$("#drawer").addEventListener("click", e => { if (e.target.id==="drawer" || e.target.closest("[data-close]")) $("#drawer").hidden = true; });
document.addEventListener("keydown", e => { if (e.key==="Escape") $("#drawer").hidden = true;
  if (e.key==="Enter" && e.target.dataset && e.target.dataset.story) openStory(e.target.dataset.story); });
$("#main").addEventListener("click", e => { const s = e.target.closest("[data-story]"), b = e.target.closest("[data-bug]");
  if (s) openStory(s.dataset.story); else if (b) openBug(b.dataset.bug); });
$("#main").addEventListener("input", e => { if (/^(bq|be|bs)$/.test(e.target.id)) fillBacklog(); if (/^(tq|ta)$/.test(e.target.id)) fillTests(); if (/^(gq|gs|gt)$/.test(e.target.id)) fillBugs(); });

/* ---------------- routing ---------------- */
function show(){
  const v = (location.hash||"").slice(1);
  const view = V[v] ? v : "overview";
  $("#main").innerHTML = V[view](); $("#main").scrollTop = 0;
  document.querySelectorAll("#nav [data-v]").forEach(b => b.classList.toggle("on", b.dataset.v===view));
  if (view==="backlog") fillBacklog(); if (view==="tests") fillTests(); if (view==="bugs") fillBugs();
}
$("#nav").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) { location.hash = b.dataset.v; } });
window.addEventListener("hashchange", show);
$("#nStories").textContent = STORIES.length; $("#nTests").textContent = TESTS.length; $("#nBugs").textContent = BUGS.length;

/* theme toggle (remembered per viewer) */
const root = document.documentElement;
function curDark(){ const t = root.dataset.theme; return t ? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function syncThemeBtn(){ $("#theme").textContent = curDark() ? "Light" : "Dark"; }
try { const t = localStorage.getItem("vrn_theme"); if (t) root.dataset.theme = t; } catch(e){}
$("#theme").addEventListener("click", () => { root.dataset.theme = curDark() ? "light" : "dark"; try { localStorage.setItem("vrn_theme", root.dataset.theme); } catch(e){} syncThemeBtn(); });
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncThemeBtn); } catch(e){}
syncThemeBtn(); show();
</script>
</body>
</html>
