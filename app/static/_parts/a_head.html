<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#02060d">
<link rel="apple-touch-icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>VERONICA AI</title>
<link href="/vendor/fonts/fonts.css" rel="stylesheet">
<style>
/* VERONICA AI - two themes on one layout:
   AURORA (default): calm premium glass, living particle core.   ARC: Iron-Man HUD skin, arc-reactor core.
   Views: full (layout) | max (chat fills screen) | dock (floating window) | home (minimised - core only). */
:root{color-scheme:dark;
 --bg:#04070e;--bg2:#071326;--card:rgba(255,255,255,.03);--card2:rgba(255,255,255,.05);--line:rgba(255,255,255,.08);--line2:rgba(120,200,255,.18);--hot:rgba(120,200,255,.5);
 --tx:#e8edf5;--mut:#7f8ca1;--ac:#62c8ff;--ac2:#a9e3ff;--blue:#3b8cff;--gold:#d7b36a;--gold2:#f0d394;--good:#45d19b;--bad:#f06b80;--warn:#f5b84a;
 --r:16px;--disp:"Inter",sans-serif;--ui:"Inter","Noto Sans Devanagari","Noto Sans Gujarati","Noto Sans Oriya",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
 --glow:0 0 0 1px rgba(98,200,255,.06),0 18px 50px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.55 var(--ui);color:var(--tx);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#bgfx{position:fixed;inset:0;pointer-events:none;z-index:0}
.theme-aurora #bgfx{background:radial-gradient(900px 600px at 50% 30%,rgba(52,140,220,.16),transparent 70%),radial-gradient(1200px 800px at 50% 115%,rgba(215,179,106,.06),transparent 60%)}
/* ---------------------------------------------------------------- layout */
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:300px minmax(0,1fr) 316px;grid-template-rows:64px minmax(0,1fr);
 grid-template-areas:"top top top" "left center right";column-gap:22px;padding:0 24px 18px}
.top{grid-area:top;display:flex;align-items:center;gap:20px;margin:0 -24px;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(4,7,14,.55);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:11px;min-width:260px}
.brand b{font:600 15px var(--disp);letter-spacing:.3em}.brand b span{color:var(--gold);font-weight:500;margin-left:5px}
.logo{width:32px;height:32px;flex:none}
.logo .orb{transform-origin:24px 24px;animation:lspin 14s linear infinite}.logo .orb2{transform-origin:24px 24px;animation:lspin 9s linear infinite reverse}
@keyframes lspin{to{transform:rotate(360deg)}}
.nav{display:flex;gap:6px;margin:0 auto}
.nav button{position:relative;border:0;background:none;color:var(--mut);font:500 13px var(--ui);padding:21px 12px;letter-spacing:.01em}
.nav button:hover{color:var(--tx)}.nav button.on{color:var(--tx)}
.nav button.on:after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 0 12px var(--ac)}
.tright{display:flex;align-items:center;gap:14px;min-width:260px;justify-content:flex-end}
.pill{display:flex;align-items:center;gap:7px;font-size:12px;color:#b9f0d8;padding:5px 11px;border:1px solid rgba(69,209,155,.28);border-radius:999px;background:rgba(69,209,155,.06);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);animation:blink 2.4s infinite}
@keyframes blink{50%{opacity:.35}}
.seg{display:flex;padding:3px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.seg button{border:0;background:none;color:var(--mut);font:600 11.5px var(--ui);padding:5px 11px;border-radius:999px;letter-spacing:.04em}
.seg button.on{background:linear-gradient(135deg,rgba(98,200,255,.22),rgba(59,140,255,.18));color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.clock{font:500 13px var(--mono);color:var(--mut)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 11.5px var(--ui);border:1px solid var(--line2);background:linear-gradient(135deg,#22324d,#121a2a);padding:0}
.menu{display:none}
.col{min-height:0;display:flex;flex-direction:column;gap:14px;padding-top:18px;overflow-y:auto;scrollbar-width:none}
.col::-webkit-scrollbar{display:none}
.L{grid-area:left}.R{grid-area:right}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;box-shadow:var(--glow)}
.card:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 38%)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.hd h3{margin:0;font:600 11px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.hd span{font-size:11.5px;color:var(--mut)}.hd .live{color:var(--good)}
.empty{color:var(--mut);font-size:12.5px}
/* pulse */
.pcard+.pcard{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.pt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}.pt b{font:600 12.5px var(--ui)}.pt a{font-size:11.5px;color:var(--ac2);text-decoration:none;cursor:pointer}
.kr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px dashed rgba(255,255,255,.06)}
.kr:first-of-type{border-top:0}
.kr .l{font-size:12px;color:var(--mut)}.kr .v{font:500 21px/1.15 var(--disp);letter-spacing:-.01em}.kr .v small{font-size:11.5px;color:var(--mut);margin-left:3px}
.kr .cmp{grid-column:1/-1;display:grid;gap:3px;margin-top:4px}
.kr .cmp i{display:block;height:4px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.kr .cmp i b{display:block;height:100%;border-radius:3px;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.kr .cmp .now b{background:linear-gradient(90deg,#2f6fd8,var(--ac))}.kr .cmp .was b{background:rgba(255,255,255,.22)}
.chg{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--ui);padding:1px 8px;border-radius:999px;align-self:center;white-space:nowrap;background:rgba(148,163,184,.12);color:var(--ac2)}
.chg.good{color:#8ee6c3;background:rgba(69,209,155,.1)}.chg.bad{color:#f7a6b3;background:rgba(240,107,128,.1)}
.skel{height:14px;border-radius:6px;margin:8px 0;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}
/* noticed */
.nt{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.nt:first-child{border-top:0;padding-top:2px}
.nt .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;background:rgba(240,107,128,.12);color:#f7a6b3}
.nt.ok .ic{background:rgba(69,209,155,.12);color:#8ee6c3}
.nt b{display:block;font:500 12.5px var(--ui)}.nt small{display:block;color:var(--mut);font-size:11.5px}
.nt button{margin-top:5px;border:0;background:none;color:var(--ac2);font:600 11.5px var(--ui);padding:0}
.nt button:hover{text-decoration:underline}
/* missions */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mt{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:13px;padding:11px 11px 10px;transition:transform .18s,border-color .18s,background .18s}
.mt:hover{transform:translateY(-2px);border-color:var(--line2);background:rgba(98,200,255,.06)}
.mt:after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(169,227,255,.18) 50%,transparent 70%);background-size:250% 100%;background-position:150% 0;transition:background-position .9s}
.mt:hover:after{background-position:-60% 0}
.mt svg{width:18px;height:18px;color:var(--ac)}.mt b{display:block;font:600 12.5px var(--ui);margin-top:6px}.mt small{display:block;color:var(--mut);font-size:11px;line-height:1.35;margin-top:2px}
.mt.gold svg{color:var(--gold)}
/* left: motion graphics only */
.L .hudc{flex:1;min-height:150px;padding:0;overflow:hidden}.L .hudc:before{display:none}
.R .hudR{padding:0;overflow:hidden;height:clamp(230px,34vh,330px);flex:none}.R .hudR:before{display:none}
canvas.hud{display:block;width:100%;height:100%}
/* center */
.center{grid-area:center;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;padding-top:10px}
.stage{position:relative;width:100%;height:clamp(200px,34vh,330px);flex:none;display:grid;place-items:center;cursor:pointer;transition:height .45s cubic-bezier(.2,.8,.2,1)}
#core3d{position:absolute;inset:0;width:100%;height:100%}
.arcwrap{position:absolute;inset:0;display:none;place-items:center}
.stage .nm{position:absolute;bottom:20px;left:0;right:0;text-align:center;pointer-events:none}
.stage .nm b{font:600 14px var(--disp);letter-spacing:.46em;padding-left:.46em}
.state{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:5px;font:600 10.5px var(--ui);letter-spacing:.2em;color:var(--mut);text-transform:uppercase}
.state i{width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}
.speaking .state{color:var(--gold)}.speaking .state i{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.listening .state{color:var(--good)}.listening .state i{background:var(--good);box-shadow:0 0 10px var(--good)}
.busy .state{color:var(--ac2)}.busy .state i{animation:blink .6s infinite}
.wv{display:inline-flex;gap:2px;align-items:center;height:12px}.wv b{width:2px;height:4px;border-radius:2px;background:currentColor;opacity:.8}
.speaking .wv b,.listening .wv b{animation:eqb .8s ease-in-out infinite}.wv b:nth-child(2){animation-delay:.1s}.wv b:nth-child(3){animation-delay:.2s}.wv b:nth-child(4){animation-delay:.3s}.wv b:nth-child(5){animation-delay:.4s}
@keyframes eqb{50%{height:12px}}
.tap{position:absolute;top:10px;right:6px;border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:999px;font:600 11px var(--ui);color:var(--mut);padding:5px 11px;letter-spacing:.04em}
.tap:hover{color:var(--tx);border-color:var(--line2)}
/* chat card */
.chat{width:100%;max-width:960px;flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);background:var(--card);border-radius:20px;box-shadow:var(--glow);overflow:hidden;position:relative}
.chathead{display:flex;align-items:center;gap:11px;padding:11px 12px 10px 16px;border-bottom:1px solid var(--line)}
.chathead .logo{width:26px;height:26px}
.chathead b{font:600 12.5px var(--disp);letter-spacing:.2em}.chathead .who{font-size:11.5px;color:var(--mut)}
.chathead .sp{flex:1}
.hb{height:32px;min-width:32px;padding:0 9px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--tx);display:inline-flex;align-items:center;justify-content:center;gap:6px;font:500 12px var(--ui)}
.hb:hover{background:rgba(98,200,255,.08);border-color:var(--line2)}.hb svg{width:15px;height:15px}
#log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:16px 20px 18px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.msg{max-width:min(880px,94%);white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;animation:min .35s cubic-bezier(.2,.8,.2,1)}
@keyframes min{from{opacity:0;transform:translateY(6px)}}
.me{align-self:flex-end;padding:9px 14px;border-radius:14px 14px 4px 14px;background:rgba(98,200,255,.1);border:1px solid var(--line2)}
.bot{align-self:flex-start;width:min(880px,100%);max-width:100%}
.bot:before{content:"VERONICA";display:flex;align-items:center;gap:8px;font:600 10.5px var(--ui);letter-spacing:.18em;color:var(--mut);margin-bottom:7px}
.bot .bt{font-size:14px;line-height:1.62;color:#dfe6f0}.bot b{color:#fff;font-weight:600}
.msg code{font:12.5px var(--mono);background:rgba(98,200,255,.1);padding:1px 5px;border-radius:5px}
.bot.typing{color:var(--ac2);display:flex;flex-direction:column}
.cursor{display:inline-block;width:7px;height:15px;margin-left:2px;vertical-align:-2px;background:var(--ac);box-shadow:0 0 8px var(--ac);animation:blink .8s steps(1) infinite}
.tdots{display:inline-flex;gap:4px;padding:4px 2px}.tdots i{width:7px;height:7px;border-radius:50%;background:var(--ac2);opacity:.4;animation:td 1s infinite}
.tdots i:nth-child(2){animation-delay:.15s}.tdots i:nth-child(3){animation-delay:.3s}@keyframes td{50%{opacity:1;transform:translateY(-3px)}}
.thinking{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12.5px}.thinking .sp1{width:14px;height:14px;border-radius:50%;border:2px solid rgba(98,200,255,.25);border-top-color:var(--ac);animation:lspin .8s linear infinite}
.meta{margin-top:10px;font-size:11.5px;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meta .say{border:1px solid var(--line);background:none;border-radius:999px;padding:2px 10px;font-size:11.5px;color:var(--ac2)}
/* KPI cards (answers) */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin:2px 0 12px;white-space:normal;align-items:start}
.kgroup{grid-column:1/-1;font:600 10.5px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-top:4px}
.kc{position:relative;overflow:hidden;display:grid;gap:3px;align-content:start;padding:11px 12px 10px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.025);min-width:0}
.kc:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--ac);box-shadow:0 0 10px var(--ac)}
.kc.good:before{background:var(--good);box-shadow:0 0 10px var(--good)}.kc.bad:before{background:var(--bad);box-shadow:0 0 10px var(--bad)}.kc.warn:before{background:var(--warn)}
.kc .kt{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:11.5px;min-width:0}.kc .kt span{overflow-wrap:anywhere;line-height:1.25}
.kc .ic{width:20px;height:20px;flex:none;border-radius:6px;display:grid;place-items:center;background:rgba(98,200,255,.1);color:var(--ac2)}.kc .ic svg{width:12px;height:12px}
.kc .val{font:500 21px/1.15 var(--disp);font-variant-numeric:tabular-nums;white-space:nowrap}.kc .val small{font-size:11.5px;color:var(--mut);margin-left:3px}
.kc .val.long{font-size:18px}.kc .val.xlong{font-size:15px}.kc .chg{justify-self:start;margin-top:2px}
.kc .bar{height:4px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:4px}.kc .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--ac))}
.kc .tg,.kc .note{font-size:11.5px;color:var(--mut);overflow-wrap:anywhere}
.tbl{margin-top:10px;overflow:auto;max-height:360px;border:1px solid var(--line);border-radius:12px;white-space:normal}
.tbl>b{display:block;padding:8px 11px;font-size:12.5px;color:var(--ac2);position:sticky;left:0}
table{border-collapse:collapse;font-size:12.5px;width:100%}
th{position:sticky;top:0;background:#0b1a30;color:var(--ac2);text-align:left;padding:7px 10px;white-space:nowrap;font-weight:600}
td{padding:5px 10px;border-top:1px solid rgba(255,255,255,.05);white-space:nowrap}td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.grp td{font-weight:600;background:rgba(98,200,255,.06)}tr.tot td{font-weight:700;color:#fff}
.chart{margin-top:10px;max-width:100%;border-radius:12px;border:1px solid var(--line);background:#fff}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;white-space:normal}
.file{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:#cfd8e4;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font:500 12.5px var(--ui)}
.file:hover{border-color:var(--line2);color:#fff}
.qchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;white-space:normal}
.qchip{border:1px solid var(--line2);background:rgba(98,200,255,.07);color:#dbeafe;border-radius:999px;padding:6px 12px;font-size:12.5px;text-align:left}
.qchip:hover{background:rgba(98,200,255,.16)}.qchip.gold{border-color:rgba(215,179,106,.4);color:var(--gold2);background:rgba(215,179,106,.06)}
/* input */
.inputbar{position:relative;width:100%;max-width:960px;padding-top:12px;flex:none}
#f{display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 10px;border-radius:18px;background:rgba(10,18,32,.86);border:1px solid var(--line2);box-shadow:0 14px 44px rgba(0,0,0,.4),0 0 0 4px rgba(98,200,255,.03);backdrop-filter:blur(14px)}
#f:focus-within{border-color:var(--hot);box-shadow:0 14px 44px rgba(0,0,0,.4),0 0 0 4px rgba(98,200,255,.08)}
#t{flex:1;min-width:0;resize:none;border:0;outline:none;background:transparent;font-size:15px;line-height:1.45;padding:9px 4px;max-height:140px}
#t::placeholder{color:#66748a}
.ib{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.ib svg{width:18px;height:18px}.ib:hover{border-color:var(--line2)}
.ib.mic{border-color:rgba(98,200,255,.3);color:var(--ac2);background:rgba(98,200,255,.07)}
.ib.send{border:0;background:linear-gradient(135deg,#7fd6ff,var(--blue));color:#04111f;box-shadow:0 6px 20px rgba(59,140,255,.35)}
.ib.rec{background:rgba(240,107,128,.18);border-color:var(--bad);color:#fecdd3;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(240,107,128,.12)}}
.ib.on{background:rgba(98,200,255,.16);border-color:var(--hot)}#spk:not(.on) .w{opacity:.25}
#lang{flex:none;align-self:center;background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 6px;font-size:12px;color:var(--mut)}#lang option{background:#071226}
.hint{text-align:center;font-size:11px;color:#56627a;margin-top:7px;letter-spacing:.02em}
.stopbtn{display:none;position:absolute;left:50%;top:-34px;transform:translateX(-50%);z-index:5;align-items:center;gap:8px;padding:7px 16px 7px 12px;border-radius:999px;border:1px solid rgba(240,107,128,.55);background:rgba(50,8,18,.9);color:#fecdd3;font:600 12.5px var(--ui);box-shadow:0 0 22px rgba(240,107,128,.35)}
.stopbtn i{width:10px;height:10px;border-radius:2px;background:var(--bad);box-shadow:0 0 8px var(--bad)}
body.speaking .stopbtn{display:inline-flex;animation:stopIn .2s both}@keyframes stopIn{from{opacity:0;transform:translate(-50%,6px)}}
#talkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;padding:8px 12px;border-radius:14px;background:rgba(10,18,32,.9);border:1px solid var(--line2);font-size:13px}
#talkbar[hidden]{display:none}#talkbar .muted{flex:1;min-width:120px}
.eq{display:inline-flex;gap:3px;align-items:center;height:18px}.eq i{width:3px;height:6px;border-radius:2px;background:var(--good)}
.listening .eq i{animation:eqb .9s ease-in-out infinite}.speaking .eq i{background:var(--gold);animation:eqb .7s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.1s}.eq i:nth-child(3){animation-delay:.2s}.eq i:nth-child(4){animation-delay:.3s}.eq i:nth-child(5){animation-delay:.4s}
.muted{color:var(--mut);font-size:12.5px}.tbtn{border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:10px;padding:7px 12px;font:500 12.5px var(--ui)}
.tbtn:hover{border-color:var(--line2)}
/* right column */
.steps{display:flex;flex-direction:column;gap:2px;max-height:280px;overflow-y:auto;scrollbar-width:none}
.st{display:grid;grid-template-columns:16px 1fr auto;gap:10px;padding:7px 0;align-items:start;animation:min .3s both}
.st .d{width:9px;height:9px;margin-top:5px;border-radius:50%;border:1.5px solid var(--warn);box-shadow:0 0 8px rgba(245,184,74,.5);animation:blink .7s infinite}
.st.done .d{border-color:var(--good);box-shadow:none;animation:none;background:rgba(69,209,155,.25)}.st.error .d{border-color:var(--bad);animation:none}

@media (max-width:980px){.theme-holo.view-full .center{display:flex}.hp{position:relative;left:auto!important;top:auto!important;width:250px!important;margin:6px;display:inline-block;vertical-align:top;white-space:normal}
 .hpanels{position:absolute;inset:0;overflow-x:auto;white-space:nowrap}.hlinks,.hpk{display:none}.hgauges{display:none}}

/* ---------------------------------------------------------------- Nova: the hologram workspace in electric blue + ice white */

.sndwrap{position:relative;display:none}.theme-holo .sndwrap{display:inline-block}

 transition:transform .3s,box-shadow .25s,border-color .25s,opacity .3s,left .45s,top .45s}
